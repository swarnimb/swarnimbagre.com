<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Swarnim Bagre — mobile</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="assets/favicon.svg" />
<link rel="stylesheet" href="colors_and_type.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; padding: 0; min-height: 100vh; background: #0E0B08; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
    box-sizing: border-box;
    color: var(--fg);
    font-family: var(--font-sans);
  }
  .stage-label {
    position: fixed;
    top: 20px; left: 24px;
    font: var(--meta-sm);
    color: var(--fg-faint);
    letter-spacing: 0.14em;
    font-family: var(--font-mono);
  }
  .device-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .device-caption {
    font: var(--meta-sm);
    color: var(--fg-faint);
    letter-spacing: 0.14em;
    font-family: var(--font-mono);
  }
  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 2px;
  }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--hairline-2); border-radius: 4px; }

  @media (max-width: 460px) {
    body { padding: 0; }
    .stage-label, .device-caption { display: none; }
    .device-wrap { gap: 0; }
  }
</style>
</head>
<body>
  <div class="stage-label">※ mobile · 390 × 844</div>

  <template id="__bundler_thumbnail" data-bg-color="#1C1712">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <rect width="1200" height="800" fill="#1C1712"/>
      <text x="120" y="430"
            font-family="Georgia, serif" font-style="italic" font-weight="300"
            font-size="220" letter-spacing="-6" fill="#F4ECDC">sb.</text>
      <line x1="120" y1="500" x2="320" y2="500" stroke="#C9A84C" stroke-width="3"/>
    </svg>
  </template>

  <div id="root"></div>

  <!-- Shared desktop components: SocialIcon, StatusPill, ProjectMedia, etc -->
  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>

  <!-- Mobile-only adapters -->
  <script type="text/babel" src="mobile-components.jsx"></script>
  <script type="text/babel" src="pages-mobile/Home.jsx"></script>
  <script type="text/babel" src="pages-mobile/Projects.jsx"></script>
  <script type="text/babel" src="pages-mobile/Writing.jsx"></script>
  <script type="text/babel" src="pages-mobile/Other.jsx"></script>

  <script type="text/babel">
    function App() {
      const valid = ["home", "projects", "writing", "other"];
      const fromHash = () => {
        const h = (window.location.hash || "").replace(/^#\/?/, "");
        return valid.includes(h) ? h : "home";
      };
      const [view, setView] = React.useState(fromHash());

      React.useEffect(() => {
        const onHash = () => setView(fromHash());
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);

      const onNav = (id) => {
        const next = valid.includes(id) ? id : "home";
        setView(next);
        const target = next === "home" ? "" : "#/" + next;
        if (window.location.hash !== target) {
          history.pushState(null, "", target || window.location.pathname);
        }
      };

      const screenLabels = {
        home: "01 Home M", projects: "02 Projects M",
        writing: "03 Writing M", other: "04 Other M",
      };

      const page = (
        <div data-screen-label={screenLabels[view]}>
          {view === "home"     && <HomeMobile     onNav={onNav} />}
          {view === "projects" && <ProjectsMobile onNav={onNav} />}
          {view === "writing"  && <WritingMobile  onNav={onNav} />}
          {view === "other"    && <OtherMobile    onNav={onNav} />}
        </div>
      );

      return (
        <div className="device-wrap">
          <IOSDevice width={390} height={844} dark={true}>
            <div style={{
              minHeight: "100%",
              background: "var(--bg)",
              color: "var(--fg)",
              fontFamily: "var(--font-sans)",
              position: "relative",
            }}>
              {page}
            </div>
          </IOSDevice>
          <div className="device-caption">tap the menu, swipe to scroll</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
